# ==========================================
# CN PROJECT - PRIVATE DNS SERVER
# Machine: Mac 1 (Arun)
# ==========================================

# Listen on localhost and Mac 1 Wi-Fi IP
listen-address=127.0.0.1,10.7.15.60

# DNS port
port=53

# Never forward plain single-label names
domain-needed

# Never forward reverse lookups for private IP ranges
bogus-priv

# Private project domain
domain=teamX.test

# DNS records: Edge server (Mac 2)
address=/app.teamX.test/10.7.21.116
address=/api.teamX.test/10.7.21.116

# Upstream DNS servers
server=8.8.8.8
server=10.5.7.1

# DNS cache
cache-size=1000

# Log queries
log-queries
log-facility=/opt/homebrew/var/log/dnsmasq.log

# Do not read system resolver configuration
no-resolv
local-ttl=30
