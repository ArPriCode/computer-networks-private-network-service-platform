worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream backend_pool {
        server 10.7.15.60:3001 max_fails=2 fail_timeout=10s;
        server 10.7.21.116:3002 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8443 ssl;
        server_name app.teamX.test api.teamX.test;

        ssl_certificate     /Users/arunkumargiri/computer-networks-private-network-service-platform/ssl/cert.pem;
        ssl_certificate_key /Users/arunkumargiri/computer-networks-private-network-service-platform/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend_pool;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
